spring.application.name: Api-Gateway

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

spring:
  application:
    name: Api-Gateway
  cloud:
    gateway:
      mvc:
        routes:
          - id: UserService
            uri: lb://USERSERVICE
            predicates:
              - Path=/api/v1/user-service/**
            filters:
              - StripPrefix=2
          - id: PostService
            uri: lb://POSTSERVICE
            predicates:
              - Path=/api/v1/post-service/**
            filters:
              - StripPrefix=2
          - id: JobService
            uri: lb://JOBSERVICE
            predicates:
              - Path=/api/v1/job-service/**
            filters:
              - StripPrefix=2
          - id: ConnectionService
            uri: lb://CONNECTIONSERVICE
            predicates:
              - Path=/api/v1/connection-service/**
            filters:
              - StripPrefix=2
