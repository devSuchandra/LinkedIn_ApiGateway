spring.application.name: Api-Gateway

eureka.client.service-url.defaultZone: http://localhost:8761/eureka/
server.port: 8080

spring:
  cloud:
    gateway:
      routes:
        - id: UserService
          uri: lb://USERSERVICE
          predicates:
            - Path=/api/v1/user-service/**
          filters:
            - StripPrefix=2
        - id: PostService
          uri: lb://POSTSERVICE
          predicates:
            - Path=/api/v1/post-service/**
          filters:
            - StripPrefix=2
        - id: JobService
          uri: lb://JOBSERVICE
          predicates:
            - Path=/api/v1/user-service/**
          filters:
            - StripPrefix=2