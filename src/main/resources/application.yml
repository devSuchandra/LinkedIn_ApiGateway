spring.application.name: Api-Gateway

server:
  port: ${SERVER_PORT:8080}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}

spring:
  application:
    name: Api-Gateway
  cloud:
    gateway:
      mvc:
        routes:
          - id: UserService
            uri: lb://USERSERVICE
            predicates:
              - Path=/api/v1/user-service/**
            filters:
              - StripPrefix=2
          - id: PostService
            uri: lb://POSTSERVICE
            predicates:
              - Path=/api/v1/post-service/**
            filters:
              - StripPrefix=2
          - id: JobService
            uri: lb://JOBSERVICE
            predicates:
              - Path=/api/v1/job-service/**
            filters:
              - StripPrefix=2
          - id: ConnectionService
            uri: lb://CONNECTIONSERVICE
            predicates:
              - Path=/api/v1/connection-service/**
            filters:
              - StripPrefix=2
  jwt:
    secret:
      key: ${JWT_SECRET_KEY:1UdVR76U1pj1RmSJJy700jauMrW5ycXvKraqQLYoaKdFBbaXyZQeygjFaSuHaIuf}
